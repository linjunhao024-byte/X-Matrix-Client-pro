[package]
name = "x-matrix"
version = "0.1.0"
description = "X-Matrix — a beautiful proxy client"
authors = ["X-Matrix"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "x_matrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# One instance per machine: a second launch focuses the running window
# instead of growing a second tray icon and a second state file.
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# A kernel that dies by itself has to reach the user while the window is
# minimized; the backend watcher fires this and nothing else would.
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Share links and subscription documents are base64 in two flavours.
base64 = "0.22"
# Subscription fetching is the only outbound HTTP we do, and it must be TLS.
# rustls keeps us free of an OpenSSL build dependency on Windows.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
# Clash-format subscriptions are YAML.
serde_yaml = "0.9"
# Domain regex rules are evaluated by the routing UI ("which rule would catch
# this site?") without a running kernel, and a half-typed pattern has to be
# rejected at save time instead of letting the kernel refuse the whole config.
regex = "1"
thiserror = "2"
parking_lot = "0.12"
# Official kernel releases ship as zip archives; both upstreams use deflate, so
# the other codecs stay out of the build.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Xray publishes `SHA2-256= <hex>` next to its zip; verifying it is the only
# reason a hash algorithm lives in this binary.
sha2 = "0.10"

# Contract layer: Rust command signatures -> src/services/bindings.ts
specta = { version = "=2.0.0-rc.26", features = ["derive", "function", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"

[target.'cfg(windows)'.dependencies]
# System proxy: three values under HKCU\...\Internet Settings, plus the two
# WinINet notifications that make a change take effect immediately.
winreg = "0.55"
windows-sys = { version = "0.60", features = [
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    # The process picker walks a Toolhelp32 snapshot.
    "Win32_System_Diagnostics_ToolHelp",
    # Lite mode hands the working set back when the window goes to the tray.
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # "以管理员身份重启" 走 ShellExecuteExW 的 runas 动词。SHELLEXECUTEINFOW 的
    # hkeyClass 字段由 Win32_System_Registry 门控，整个 struct 跟着它才存在，
    # 所以两个 feature 都要开。
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }
# Lite mode asks WebView2 itself to shrink: `SetMemoryUsageTargetLevel` lives on
# `ICoreWebView2_13`, and the controller Tauri hands out is a webview2-com object,
# so the interface can only be named through that crate. Both already arrive
# transitively (wry uses webview2-com 0.38, which pins windows-core 0.61); listing
# them here keeps the call sites honest about which versions they talk to.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
